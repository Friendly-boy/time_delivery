<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시간 배달부</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #17202a;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    canvas {
      width: min(576px, 100%);
      height: auto;
      border: 2px solid #526579;
      background: #263746;
    }
    p { line-height: 1.7; }
    button {
      padding: 10px 18px;
      margin: 8px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>시간 배달부</h1>
  <canvas id="game" width="576" height="448"></canvas>
  <p id="status">스위치까지 걸어간 뒤 R을 눌러 시간을 되감으세요.</p>
  <p>이동: 방향키 또는 WASD · 되감기/재시작: R</p>
  <button id="rewind">시간 되감기 (R)</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");

    const CELL = 64;
    const COLS = 9;
    const ROWS = 7;
    const START = { x: 1, y: 3 };
    const SWITCH = { x: 2, y: 2 };
    const DOOR = { x: 4, y: 3 };
    const PACKAGE = { x: 6, y: 3 };
    const GOAL = { x: 7, y: 3 };

    const walls = new Set();

    for (let x = 0; x < COLS; x++) {
      walls.add(`${x},0`);
      walls.add(`${x},${ROWS - 1}`);
    }
    for (let y = 0; y < ROWS; y++) {
      walls.add(`0,${y}`);
      walls.add(`${COLS - 1},${y}`);
    }
    for (const y of [1, 2, 4, 5]) {
      walls.add(`4,${y}`);
    }

    let player = { ...START };
    let path = [];
    let echo = null;
    let echoIndex = 0;
    let mode = "record";
    let hasPackage = false;
    let won = false;
    let replayTimer = null;

    function same(a, b) {
      return a && b && a.x === b.x && a.y === b.y;
    }

    function doorOpen() {
      return mode === "replay" && same(echo, SWITCH);
    }

    function drawCell(x, y, color, border = "#34495e") {
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      ctx.strokeStyle = border;
      ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          drawCell(x, y, "#263746");
        }
      }

      for (const wall of walls) {
        const [x, y] = wall.split(",").map(Number);
        drawCell(x, y, "#111820", "#111820");
      }

      // 스위치
      ctx.fillStyle = same(echo, SWITCH) ? "#f1c40f" : "#8e7d32";
      ctx.beginPath();
      ctx.arc(
        SWITCH.x * CELL + CELL / 2,
        SWITCH.y * CELL + CELL / 2,
        20, 0, Math.PI * 2
      );
      ctx.fill();
      ctx.fillStyle = "#17202a";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("스위치", SWITCH.x * CELL + 32, SWITCH.y * CELL + 36);

      // 문
      ctx.fillStyle = doorOpen() ? "#2ecc71" : "#c0392b";
      ctx.fillRect(DOOR.x * CELL + 8, DOOR.y * CELL + 4, 48, 56);
      ctx.fillStyle = "white";
      ctx.font = "13px sans-serif";
      ctx.fillText(
        doorOpen() ? "열림" : "문",
        DOOR.x * CELL + 32,
        DOOR.y * CELL + 36
      );

      // 배달 목표와 소포
      ctx.font = "30px sans-serif";
      ctx.fillText("🏁", GOAL.x * CELL + 32, GOAL.y * CELL + 42);
      if (!hasPackage) {
        ctx.fillText("📦", PACKAGE.x * CELL + 32, PACKAGE.y * CELL + 43);
      }

      // 시간의 잔상
      if (echo) {
        ctx.fillStyle = "rgba(93, 173, 226, 0.9)";
        ctx.beginPath();
        ctx.arc(echo.x * CELL + 32, echo.y * CELL + 32, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.font = "12px sans-serif";
        ctx.fillText("잔상", echo.x * CELL + 32, echo.y * CELL + 36);
      }

      // 플레이어
      ctx.fillStyle = "#f5f5f5";
      ctx.beginPath();
      ctx.arc(player.x * CELL + 32, player.y * CELL + 32, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#17202a";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText("나", player.x * CELL + 32, player.y * CELL + 37);

      if (won) {
        statusText.textContent = "배달 성공! 🎉 R을 눌러 다시 시작하세요.";
      } else if (mode === "record") {
        statusText.textContent = "스위치까지 걸어간 뒤 R을 눌러 시간을 되감으세요.";
      } else {
        statusText.textContent = "잔상이 스위치를 밟으면 문이 열립니다. 소포를 집어 골인하세요.";
      }
    }

    function move(dx, dy) {
      if (won) return;

      const next = { x: player.x + dx, y: player.y + dy };
      if (walls.has(`${next.x},${next.y}`)) return;
      if (same(next, DOOR) && !doorOpen()) return;

      player = next;

      if (mode === "record") {
        path.push({ ...player });
      }

      if (same(player, PACKAGE)) hasPackage = true;
      if (hasPackage && same(player, GOAL)) won = true;

      draw();
    }

    function rewind() {
      if (won) {
        reset();
        return;
      }

      if (mode === "record") {
        if (!path.length || !same(path[path.length - 1], SWITCH)) {
          statusText.textContent = "먼저 스위치 위에 서세요. (시작점에서 위, 오른쪽)";
          return;
        }
        mode = "replay";
      }

      clearInterval(replayTimer);
      player = { ...START };
      echo = null;
      echoIndex = 0;
      hasPackage = false;

      // 잔상이 기록된 길을 따라가고, 스위치에 도착하면 머뭅니다.
      replayTimer = setInterval(() => {
        if (echoIndex < path.length) {
          echo = { ...path[echoIndex] };
          echoIndex++;
          draw();
        } else {
          clearInterval(replayTimer);
        }
      }, 350);

      draw();
    }

    function reset() {
      clearInterval(replayTimer);
      player = { ...START };
      path = [];
      echo = null;
      echoIndex = 0;
      mode = "record";
      hasPackage = false;
      won = false;
      draw();
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      const moves = {
        arrowup: [0, -1], w: [0, -1],
        arrowdown: [0, 1], s: [0, 1],
        arrowleft: [-1, 0], a: [-1, 0],
        arrowright: [1, 0], d: [1, 0]
      };

      if (moves[key]) {
        event.preventDefault();
        move(...moves[key]);
      } else if (key === "r") {
        rewind();
      }
    });

    document.getElementById("rewind").addEventListener("click", rewind);
    draw();
  </script>
</body>
</html>
