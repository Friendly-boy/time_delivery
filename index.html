<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시간 배달부</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="header">
      <p class="eyebrow">TIME DELIVERY</p>
      <h1>시간 배달부</h1>
      <p class="subtitle">과거의 나와 협력해 소포를 배달하세요.</p>
    </header>

    <section class="game-panel" aria-label="게임">
      <canvas
        id="game"
        width="576"
        height="448"
        aria-label="시간 배달부 게임 화면"
      ></canvas>

      <div class="game-info">
        <p id="status" role="status">스위치까지 이동한 뒤 시간을 되감으세요.</p>
        <p class="controls-hint">
          이동: 방향키 또는 WASD
          <span aria-hidden="true">·</span>
          되감기: R
        </p>
      </div>
    </section>

    <section class="buttons" aria-label="게임 조작">
      <div class="direction-pad" aria-label="이동 버튼">
        <button class="direction up" data-move="0,-1" aria-label="위로 이동">▲</button>
        <button class="direction left" data-move="-1,0" aria-label="왼쪽으로 이동">◀</button>
        <button class="direction down" data-move="0,1" aria-label="아래로 이동">▼</button>
        <button class="direction right" data-move="1,0" aria-label="오른쪽으로 이동">▶</button>
      </div>

      <div class="action-buttons">
        <button id="rewind-button" class="button button-primary">
          시간 되감기
        </button>
        <button id="reset-button" class="button button-secondary">
          처음부터
        </button>
      </div>
    </section>

    <footer>
      <p>스위치에 잔상을 남기고, 열린 문을 지나 소포를 배달하세요.</p>
    </footer>
  </main>
</body>
</html>
